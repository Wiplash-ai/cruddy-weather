<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-labelledby="title description">
  <title id="title">Cruddy Weather hot-pink poop</title>
  <desc id="description">A smiling hot-pink poop emoji with a dark outline and a tiny sparkle.</desc>
  <style>
    .crud { transform-box: fill-box; transform-origin: center; animation: bob 3.4s ease-in-out infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.8s ease-in-out infinite; }
    .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 2.2s steps(2, end) infinite; }
    @keyframes bob { 50% { transform: translateY(-4px) rotate(1.5deg); } }
    @keyframes blink { 0%, 46%, 52%, 100% { transform: scaleY(1); } 49% { transform: scaleY(.12); } }
    @keyframes twinkle { 50% { transform: rotate(18deg) scale(.72); opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .crud,.eyes,.spark { animation: none; } }
  </style>
  <g class="crud">
    <path d="M29 157C13 157 4 147 6 132c2-13 12-23 26-27-8-8-10-19-5-29 6-12 18-18 32-17-6-10-4-21 4-29 8-8 20-9 31-15 8-4 13-9 12-15 18 10 27 28 20 44 17-2 31 8 35 23 2 9 0 17-5 24 15 6 23 18 23 31 0 20-15 35-38 35H29Z" fill="#ff2a98" stroke="#160b11" stroke-width="8" stroke-linejoin="round"/>
    <path d="M48 70c8-5 18-6 27-3M79 40c10-2 20-7 25-14M119 58c10-3 19 0 25 8M26 121c8-8 17-10 27-8" fill="none" stroke="#ff82c5" stroke-width="8" stroke-linecap="round" opacity=".9"/>
    <g class="eyes">
      <ellipse cx="69" cy="103" rx="15" ry="17" fill="#fff" stroke="#160b11" stroke-width="5"/>
      <ellipse cx="116" cy="103" rx="15" ry="17" fill="#fff" stroke="#160b11" stroke-width="5"/>
      <circle cx="72" cy="106" r="6" fill="#160b11"/>
      <circle cx="113" cy="106" r="6" fill="#160b11"/>
    </g>
    <path d="M59 128c19 12 45 12 65 0-3 19-15 28-33 28-17 0-29-10-32-28Z" fill="#160b11" stroke="#160b11" stroke-width="4" stroke-linejoin="round"/>
    <path d="M75 146c10-6 22-6 32 0-4 6-10 9-16 9s-12-3-16-9Z" fill="#ff82c5"/>
    <path d="M47 97c4-6 9-9 15-11M123 86c6 2 11 5 15 11" fill="none" stroke="#160b11" stroke-width="6" stroke-linecap="round"/>
  </g>
  <path class="spark" d="m151 21 4 11 11 4-11 4-4 11-4-11-11-4 11-4Z" fill="#ff2a98" stroke="#160b11" stroke-width="3" stroke-linejoin="round"/>
</svg>
